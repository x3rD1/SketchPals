name: canvas-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sketch_db

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    expose:
      - "3000"

    env_file:
      - ./backend/.env.prod

    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  postgres_prod_data:
